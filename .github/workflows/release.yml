name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:

  # ─────────────────────────────────────────────
  # 1. LINUX — build .deb
  # ─────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 libglib2.0-0 libdbus-1-3 \
            libxcb-xinerama0 libxcb-cursor0 \
            dpkg-dev fakeroot

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install ".[all]"
          pip install pyinstaller

      - name: Build executable with PyInstaller
        run: |
          pyinstaller \
            --onefile \
            --windowed \
            --name noteration \
            --icon noteration/assets/images/icon.png \
            --collect-all PySide6 \
            --collect-all shiboken6 \
            --collect-all papis \
            --collect-all pymupdf \
            --hidden-import PySide6.QtSvg \
            --hidden-import PySide6.QtPdf \
            --hidden-import PySide6.QtPdfWidgets \
            --add-data "noteration/assets:noteration/assets" \
            noteration/app.py

      - name: Package as .deb
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          mkdir -p pkg/DEBIAN
          mkdir -p pkg/usr/local/bin
          mkdir -p pkg/usr/share/applications
          mkdir -p pkg/usr/share/icons/hicolor/256x256/apps

          cp dist/noteration pkg/usr/local/bin/noteration
          chmod +x pkg/usr/local/bin/noteration

          cp noteration/assets/images/icon_256.png \
             pkg/usr/share/icons/hicolor/256x256/apps/noteration.png

          cat > pkg/DEBIAN/control << EOF
          Package: noteration
          Version: ${VERSION}
          Architecture: amd64
          Maintainer: lilamr <https://github.com/lilamr>
          Description: Research note-taking app
           Markdown editor, PDF viewer, Git sync, Papis integration.
          EOF

          cat > pkg/usr/share/applications/noteration.desktop << EOF
          [Desktop Entry]
          Name=Noteration
          Comment=Research note-taking app
          Exec=/usr/local/bin/noteration
          Icon=noteration
          Terminal=false
          Type=Application
          Categories=Office;Education;Science;
          EOF

          # Build versioned
          fakeroot dpkg-deb --build pkg noteration_${VERSION}_amd64.deb
          # Salinan nama tetap untuk URL permanen
          cp noteration_${VERSION}_amd64.deb noteration-latest-linux.deb

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: "*.deb"

  # ─────────────────────────────────────────────
  # 2. WINDOWS — build .exe installer
  # ─────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install ".[all]"
          pip install pyinstaller

      - name: Build executable with PyInstaller
        run: |
          pyinstaller `
            --onefile `
            --windowed `
            --name Noteration `
            --icon noteration/assets/images/icon.ico `
            --collect-all PySide6 `
            --collect-all shiboken6 `
            --collect-all papis `
            --collect-all pymupdf `
            --hidden-import PySide6.QtSvg `
            --hidden-import PySide6.QtPdf `
            --hidden-import PySide6.QtPdfWidgets `
            --add-data "noteration/assets;noteration/assets" `
            noteration/app.py

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Create Inno Setup script
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          @"
          [Setup]
          AppName=Noteration
          AppVersion=$version
          AppPublisher=lilamr
          AppPublisherURL=https://github.com/lilamr/noteration
          DefaultDirName={autopf}\Noteration
          DefaultGroupName=Noteration
          OutputDir=installer
          OutputBaseFilename=Noteration-Setup-$version
          SetupIconFile=noteration\assets\images\icon.ico
          Compression=lzma
          SolidCompression=yes
          WizardStyle=modern
          UninstallDisplayIcon={app}\Noteration.exe

          [Languages]
          Name: "english"; MessagesFile: "compiler:Default.isl"

          [Tasks]
          Name: "desktopicon"; Description: "Create a desktop shortcut"; GroupDescription: "Additional icons:"

          [Files]
          Source: "dist\Noteration.exe"; DestDir: "{app}"; Flags: ignoreversion

          [Icons]
          Name: "{group}\Noteration"; Filename: "{app}\Noteration.exe"
          Name: "{group}\Uninstall Noteration"; Filename: "{uninstallexe}"
          Name: "{commondesktop}\Noteration"; Filename: "{app}\Noteration.exe"; Tasks: desktopicon

          [Run]
          Filename: "{app}\Noteration.exe"; Description: "Launch Noteration"; Flags: nowait postinstall skipifsilent
          "@ | Out-File -FilePath noteration.iss -Encoding UTF8

      - name: Compile installer
        shell: pwsh
        run: |
          mkdir installer
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" noteration.iss
          
          # Build versioned sudah otomatis dari Inno Setup
          # Salinan nama tetap untuk URL permanen
          $version = "${{ github.ref_name }}".TrimStart('v')
          Copy-Item "installer\Noteration-Setup-$version.exe" `
                    "installer\noteration-latest-windows.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: installer/*.exe

  # ─────────────────────────────────────────────
  # 3. macOS — build .dmg
  # ─────────────────────────────────────────────
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install ".[all]"
          pip install pyinstaller

      - name: Build .app bundle with PyInstaller
        run: |
          pyinstaller \
            --windowed \
            --name Noteration \
            --icon noteration/assets/images/icon.icns \
            --collect-all PySide6 \
            --collect-all shiboken6 \
            --collect-all papis \
            --collect-all pymupdf \
            --hidden-import PySide6.QtSvg \
            --hidden-import PySide6.QtPdf \
            --hidden-import PySide6.QtPdfWidgets \
            --add-data "noteration/assets:noteration/assets" \
            --osx-bundle-identifier com.lilamr.noteration \
            noteration/app.py

      - name: Create .dmg
        run: |
          brew install create-dmg
          # Use GITHUB_REF_NAME directly to avoid scope issues
          VERSION=${GITHUB_REF_NAME#v}

          # Build versioned
          create-dmg \
            --volname "Noteration $VERSION" \
            --volicon "noteration/assets/images/icon.icns" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "Noteration.app" 150 200 \
            --hide-extension "Noteration.app" \
            --app-drop-link 450 200 \
            "Noteration-${VERSION}.dmg" \
            "dist/Noteration.app"

          # Salinan nama tetap untuk URL permanen
          cp "Noteration-${VERSION}.dmg" "noteration-latest-macos.dmg"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: "*.dmg"

  # ─────────────────────────────────────────────
  # 4. PYTHON WHEEL — untuk pip install
  # ─────────────────────────────────────────────
  build-wheel:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheel and sdist
        run: |
          pip install build
          python -m build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-wheel
          path: dist/*

  # ─────────────────────────────────────────────
  # 5. RELEASE — kumpulkan semua & publish
  # ─────────────────────────────────────────────
  release:
    needs: [build-linux, build-windows, build-macos, build-wheel]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: ls -lh release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Noteration ${{ github.ref_name }}"
          body: |
            ## Installation

            ### One-liner (Linux & macOS)
            ```bash
            curl -fsSL https://noteration.app/install.sh | bash
            ```

            ### One-liner (Windows PowerShell)
            ```powershell
            irm https://noteration.app/install.ps1 | iex
            ```

            ### Direct download

            | Platform | Versioned | Permanent URL |
            |---|---|---|
            | Linux (Ubuntu/Debian) | `noteration_*_amd64.deb` | [noteration-latest-linux.deb](https://github.com/lilamr/noteration/releases/latest/download/noteration-latest-linux.deb) |
            | Windows | `Noteration-Setup-*.exe` | [noteration-latest-windows.exe](https://github.com/lilamr/noteration/releases/latest/download/noteration-latest-windows.exe) |
            | macOS | `Noteration-*.dmg` | [noteration-latest-macos.dmg](https://github.com/lilamr/noteration/releases/latest/download/noteration-latest-macos.dmg) |
            | Any (pip) | — | `pip install "noteration[all]"` |

            See [CHANGELOG.md](https://github.com/lilamr/noteration/blob/main/CHANGELOG.md) for what's new.
          files: release-assets/*
          generate_release_notes: false
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
